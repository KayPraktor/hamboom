# CI هم‌بوم — M5 فاز ۳.
#
# ── دو job، و دلیلِ دو تا بودنشان ───────────────────────────────────────────
#
# `verify`   — همان **یک** دستورِ `pnpm verify`. هیچ گیتی این‌جا کپی نمی‌شود.
# `services` — چیزهایی که **دیتابیسِ زنده** می‌خواهند و به همین دلیل بیرونِ verifyاند.
#
# ★★ **هیچ گیتی در YAML بازنویسی نمی‌شود.** هر مرحله یک اسکریپتِ `package.json` است که
# روی ماشینِ توسعه هم دقیقاً همان‌طور اجرا می‌شود. اگر گیتی این‌جا کپی می‌شد، همان لحظه
# دو تعریف پیدا می‌کرد و یکی‌شان بی‌صدا کهنه می‌شد.
#
# ★ `services` **از `docker-compose.yml`ِ خودِ ریپو** استفاده می‌کند، نه از یک تعریفِ
# موازیِ `services:`ِ گیت‌هاب. دلیلش P3 است: «`docker compose up` باید کافی باشد» — پس
# CI باید دقیقاً همان مسیر را برود که توسعه‌دهنده می‌رود.
#
# ★ و `.env` از `.env.example` ساخته می‌شود، که یعنی **`.env.example` هم آزموده می‌شود**:
# اگر کسی متغیری اضافه کند و آن‌جا ننویسدش، این job قرمز می‌شود.
#
# ── ⚠️ گام ۳٫۴: چیزهایی که در CI اجرا **نمی‌شوند** و جبرانشان ───────────────
#
# | گیت | چرا نمی‌شود | جبران |
# |---|---|---|
# | E2Eی مرورگر (`test:e2e`) | مرورگرِ واقعی + بومِ GPU لازم دارد؛ در همین محیط هم screenshot تایم‌اوت می‌کند | دستی پیش از هر تحویل — و رفتارِ بوم در فاز ۸/۹ی M3 در مرورگر اثبات شد |
# | `billing:probe-gateway` | **اینترنت + پرداختِ دستیِ انسان** روی سندباکسِ زرین‌پال | دستی، و قراردادِ درگاه در M4 فاز ۱ با تماسِ زنده قفل شد |
# | `rt:bench` | عددش machine-specific است؛ در CI یعنی یک عددِ بی‌معنا که قرمز/سبزش تصادفی است | دستی، و در [`docs/realtime-baseline.md`](../../docs/realtime-baseline.md) ثبت است |
# | مشقِ بازیابیِ پشتیبان | هنوز ساخته نشده | **فاز ۷** — و آن‌جا گیت می‌شود |
#
# ⚠️ **و یک وابستگیِ بیرونی که هنوز اثبات نشده:** خودِ GitHub Actions از این حساب/شبکه.
# این فایل عمداً هیچ‌چیزِ مخصوصِ گیت‌هاب ندارد جز نحوِ YAML — همه‌ی مراحل `pnpm …`اند، پس
# اگر لازم شد روی هر runnerِ دیگری هم منتقل می‌شود.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# اجرای قبلیِ همان شاخه لغو شود — صفِ CI برای یک توسعه‌دهنده‌ی تک‌نفره بی‌معناست.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ★ تنها گیتِ قابلِ استناد. دلیلش در صدرِ scripts/verify.mjs.
      - run: pnpm verify

  services:
    name: سنجه‌های زیرساختِ زنده
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ⚠️ پورت‌ها این‌جا پیش‌فرضِ PLAN اند (۵۴۳۲/۶۳۷۹/۹۰۰۰). روی ماشینِ توسعه‌ی ویندوز
      #    جابه‌جا شده‌اند چون رنجِ excludedِ ویندوز آن‌ها را می‌گیرد — یک تله‌ی محیطی که
      #    runnerِ لینوکسی ندارد.
      - name: ساختِ .env از .env.example
        run: cp .env.example .env
      - name: بالاآوردنِ postgres + redis + minio
        run: pnpm db:up
      # ⚠️ `pnpm ci:wait` و نه `node scripts/…` — اسکریپت باید `.env` را **بارگذاری**
      #    کند، نه فقط اینکه فایلش وجود داشته باشد. اولین اجرای واقعیِ CI دقیقاً همین‌جا
      #    قرمز شد: فایل ساخته شده بود ولی هیچ‌کس نخوانده بودش.
      - name: انتظار برای آمادگیِ سرویس‌ها
        run: pnpm ci:wait

      - name: migration
        run: pnpm db:migrate
      - name: db:smoke
        run: pnpm db:smoke
      - name: db:fk-test
        run: pnpm db:fk-test
      - name: db:store-test
        run: pnpm db:store-test
      # ★ M6 فاز ۳٫۴ — تنها نویسنده‌ی `is_staff`: پرچم + audit در یک تراکنش، شکستِ audit پرچم را
      #   برنمی‌گردانَد. روی PGِ واقعی داخلِ تراکنشِ rollback‌شونده (الگوی db:fk-test).
      - name: ★ admin-grant-staff — خودآزمون (اتمیک‌بودنِ پرچم + audit)
        run: pnpm admin:grant-staff -- --self-test
      # ★ M6 فاز ۴٫۴ — نگهداشتِ audit_logs: مرزِ SQLِ واقعی + «بدونِ عدد بالا نمی‌آید». حذف می‌کند،
      #   پس خودآزمونش این‌جاست (همان دلیلِ purge/sweep).
      - name: ★ purge-audit — خودآزمون
        run: pnpm infra:purge-audit -- --self-test
      - name: storage + assets
        run: pnpm storage:smoke && pnpm assets:smoke

      - name: billing — probeها
        run: pnpm billing:probe-db && pnpm billing:probe-idem && pnpm billing:probe-math
      - name: billing — سنجه‌های تسویه/ظرفیت/آشتی‌دهی/استرداد
        # ★ M6 فاز ۶: `billing:refund` کنارِ بقیه — مدلِ استرداد کدِ پول است و یک مشقِ دستی
        #   همان `lint:css`ِ هیچ‌وقت-اجرانشده می‌شود.
        run: pnpm billing:settle && pnpm billing:quota && pnpm billing:probe-reconcile && pnpm billing:refund
      - name: قراردادِ sdk
        run: pnpm sdk:contract
      - name: advisory lock (ADR-060)
        run: pnpm infra:probe-lock

      # ★★ M5 فاز ۸ — نگهداشت. هر دو **حذف** می‌کنند، پس هر دو خودآزمونشان این‌جا
      #    می‌آید: خطای این‌ها یک گزارشِ غلط نیست، پاک‌شدنِ داده‌ی یک کاربرِ زنده است.
      - name: ★★ جاروبِ بلابِ یتیم + purge — خودآزمون
        run: pnpm infra:sweep-orphans -- --self-test && pnpm infra:purge -- --self-test

      # ⚠️ این هفت **skip نمی‌شوند** (CLAUDE.md): هرکدام باگی گرفتند که همه‌ی تست‌های
      #    واحدِ سبز از رویش رد شده بودند. `rt:bench` عمداً نیست — دلیلش در جدولِ بالا.
      - name: هفت سنجه‌ی realtime
        run: >
          pnpm rt:durability && pnpm rt:compaction && pnpm rt:permission &&
          pnpm rt:presence && pnpm rt:cluster && pnpm rt:shutdown && pnpm rt:reconnect

      # ★★ M6 فاز ۵ (ADR-066): همان probeِ فاز ۱ با انتظارِ برعکس، روی api+realtime‌ی واقعی —
      #    staff ⇒ viewer (نوشتن رد)، تعلیق fail-closed در refresh/rt-token/OTP/دست‌دادنِ نو، و
      #    «WSِ باز هنوز می‌نویسد» به‌عنوانِ محدودیتِ **مستند** assert می‌شود (نه پنهان).
      - name: سنجه‌ی دسترسیِ ادمین (staff→viewer، تعلیق)
        run: pnpm admin:access

      # ★★ M5 فاز ۷ / M6 فاز ۲ — دوامِ داده. عمداً **داخلِ** CI: مشقِ بازیابی‌ای که فقط دستی
      #    اجرا شود، همان گیتی است که هیچ‌وقت اجرا نمی‌شود (درسِ `lint:css` و
      #    `db:smoke`ی ماه‌ها-قرمز). این‌جا هر push یک پشتیبانِ واقعی می‌سازد و
      #    **برش می‌گرداند**.
      # ⚠️ M6: عمداً **بعد از** سنجه‌های realtime — `rt:compaction` اولین snapshotهای واقعی را
      #    می‌نویسد؛ پیش از آن `board_snapshots` خالی است و چکِ `bytes`ِ مشق و چکِ `catalog`ِ
      #    بازیابیِ storage روی «هیچ» vacuous می‌ماندند (یافته‌ی بازبینِ خصمانه‌ی نقشه‌ی M6).
      - name: ★ پشتیبانِ جفت (dump + آینه‌ی Object Storage) + خودآزمونِ آینه
        run: pnpm infra:backup-all && pnpm infra:backup-storage -- --self-test
      - name: ★★ مشقِ بازیابی (۶ چک) + خودآزمونش
        run: pnpm infra:restore-drill && pnpm infra:restore-drill -- --self-test
      - name: ★★ بازیابیِ Object Storage (۶ چک) + خودآزمونش
        run: pnpm infra:restore-storage && pnpm infra:restore-storage -- --self-test

      - name: لاگِ سرویس‌ها در صورتِ شکست
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env logs --tail=100
