# ساختِ ایمیج‌های production — M5 گام ۳٫۵.
#
# ⚠️⚠️ **این workflow هیچ‌جا push نمی‌کند، و این عمدی است.**
#
# مقصدِ رجیستری هنوز **تصمیم گرفته نشده** و تصمیمش به یک اندازه‌گیری بسته است که هنوز
# ممکن نبوده: **VMِ آروان از کجا می‌تواند pull کند؟** فاز ۱ کشیدنِ `node:24-bookworm-slim`
# را در ۴۳ ثانیه اندازه گرفت، ولی **از ماشینِ توسعه** — نه از داخلِ ایران روی آن VM.
# انتخابِ ghcr.io یا Docker Hub بدونِ آن عدد، همان «فرض به‌جای probe»ی است که این ماژول
# قاعده‌اش را گذاشته. ⇒ در TODO به‌عنوانِ **M5-D10** ثبت شد.
#
# پس کارِ امروزِ این job یک ادعای کوچک‌تر ولی واقعی است: **Dockerfileها هنوز build
# می‌شوند و گاردهای بوت هنوز داخلِ ایمیجِ ساخته‌شده زنده‌اند.**

name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (بدونِ push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: build — api
        run: docker build -f infra/docker/api.Dockerfile -t hamboom/api:ci .
      - name: build — realtime
        run: docker build -f infra/docker/realtime.Dockerfile -t hamboom/realtime:ci .
      - name: build — web
        run: docker build -f infra/docker/web.Dockerfile -t hamboom/web:ci .

      # ★★ گاردهای بوت باید **داخلِ خودِ ایمیج** زنده باشند، نه فقط در تستِ واحد.
      #    ⚠️ بدونِ دیتابیس اجرا می‌شوند و همین درست است — هر دو **پیش از** هر کوئری می‌شکنند.
      #
      # ⚠️⚠️ **این چک عمداً به نامِ خطا حساس است، و همان حساسیت یک‌بار قرمزش کرد.**
      #    نگارشِ اول دنبالِ `GatewayNotAllowedError` می‌گشت؛ فاز ۴ گیتِ **پیامک** را جلوتر
      #    گذاشت و این مرحله در CI افتاد با پیامِ «بالا نیامد، ولی به دلیلِ دیگری» — دقیقاً
      #    کاری که باید می‌کرد: یک شکستِ دیگر را به‌جای اثباتِ گیت **قبول نکرد**.
      #    ⊕ گیتِ درگاه حالا در production هرگز **اول** نمی‌شکند (پیامک قبلش می‌ایستد)؛
      #    اثباتش در [`app.test.ts`](../../apps/api/src/app.test.ts) است.
      - name: گاردهای بوت داخلِ ایمیج زنده‌اند
        run: |
          BASE_ENV=(
            -e DATABASE_URL=postgres://u:p@nowhere:5432/db
            -e S3_ENDPOINT=http://nowhere:9000
            -e S3_ACCESS_KEY_ID=x
            -e S3_SECRET_ACCESS_KEY=y
            -e S3_BUCKET_ASSETS=a
            -e S3_BUCKET_SNAPSHOTS=b
            -e ZARINPAL_CALLBACK_URL=http://example.test/billing/zarinpal/callback
            -e WEB_BASE_URL=http://example.test
            -e APP_ENV=production
            -e PAYMENT_PROVIDER=zarinpal
            -e ZARINPAL_MERCHANT_ID=00000000-0000-0000-0000-000000000000
          )

          assert_refused() {
            local name="$1" expected="$2" secret="$3"
            if docker run --rm "${BASE_ENV[@]}" -e JWT_SECRET="$secret" hamboom/api:ci > gate.log 2>&1; then
              echo "✖ $name: ایمیج بالا آمد — گیت مرده است."
              cat gate.log
              exit 1
            fi
            if ! grep -q "$expected" gate.log; then
              echo "✖ $name: بالا نیامد، ولی به دلیلِ **دیگری**؛ انتظار: $expected"
              cat gate.log
              exit 1
            fi
            echo "✔ $name ⇒ بوت رد شد ($expected)"
          }

          # ۱. رازِ سالم ⇒ گاردِ پیکربندی رد می‌شود و **پیامک** اولین چیزی است که می‌ایستد.
          assert_refused "پیامکِ ساختگی در production" \
            SmsProviderNotAllowedError 9f3a7c1e4b8d2065af13ce97b402d85f

          # ۲. رازِ ضعیف ⇒ گاردِ پیکربندی **پیش از** همه می‌شکند (پیش‌فرضِ واقعیِ .env.example).
          assert_refused "رازِ ضعیف در production" \
            ProductionConfigError change_me_dev_only_jwt_secret_at_least_32_chars_long

      # ★★ M5 فاز ۷: پشتیبان و مشقِ بازیابی **داخلِ همین ایمیج** اجرا می‌شوند
      #    (ADR-062: بدونِ ایمیجِ دوم). jobِ `services` منطقشان را می‌سنجد، ولی آن‌جا
      #    ابزار ممکن است از PATHِ runner بیاید — پس این‌جا صریح ادعا می‌شود که
      #    خودِ ایمیج کلاینتِ **هم‌نسخه‌ی** سرور را دارد.
      - name: کلاینتِ Postgres در ایمیجِ api، هم‌نسخه‌ی سرورِ compose
        run: |
          set -euo pipefail
          server=$(grep -oE 'postgres:[0-9]+' infra/docker/docker-compose.prod.yml | head -1 | cut -d: -f2)
          echo "سرورِ compose: $server"
          for tool in pg_dump pg_restore psql; do
            got=$(docker run --rm --entrypoint "$tool" hamboom/api:ci --version)
            echo "$got"
            case "$got" in
              *" $server."*) ;;
              *) echo "✖ $tool با سرورِ $server هم‌نسخه نیست"; exit 1 ;;
            esac
          done

      - name: حجمِ ایمیج‌ها
        run: |
          {
            echo "| ایمیج | حجم |"
            echo "|---|---|"
            # ⚠️ `docker images` **حداکثر یک** آرگومان می‌گیرد. نگارشِ اول هر سه را با هم
            #    می‌داد و اولین اجرای واقعیِ CI همین‌جا قرمز شد — با اینکه هر سه build
            #    شده بودند و گاردِ بوت هم پاس شده بود.
            for tag in api realtime web; do
              docker images --format '| `{{.Repository}}:{{.Tag}}` | {{.Size}} |' "hamboom/$tag:ci"
            done
          } >> "$GITHUB_STEP_SUMMARY"
