# استکِ **production/staging** هم‌بوم — M5 گام ۲٫۴ ([ADR-059](../../ARCHITECTURE_DECISIONS.md#adr-059):
# Compose روی VM، نه K8s).
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d
#
# ⚠️ این فایل با [`docker-compose.yml`](docker-compose.yml)ِ توسعه **قاطی نمی‌شود**: آن یکی
# فقط زیرساخت را می‌آورد (و MinIO)، این یکی خودِ اپ را هم می‌آورد و Object Storage را از
# آروان می‌گیرد.
#
# ── چهار تصمیمِ عمدی ──────────────────────────────────────────────────────────
#
# ۱. ★★ **postgres و redis هیچ پورتی روی هاست publish نمی‌کنند.** فقط از شبکه‌ی داخلیِ
#    compose دیده می‌شوند؛ تنها دربِ ورودی `web` است. یک دیتابیسِ باز روی IPِ عمومیِ VM
#    همان اتفاقی است که در گزارش‌های نشتِ داده تکرار می‌شود.
# ۲. ★ **هر سرویس فقط متغیرهای خودش را می‌بیند** (`environment:` صریح، نه `env_file`ِ
#    فراگیر) — M5-D6. پس `ZARINPAL_*` هرگز داخلِ کانتینرِ postgres نیست.
# ۳. ★ **migration یک سرویسِ یک‌بارمصرف است**، نه کاری که کسی دستی یادش می‌ماند؛ `api`
#    تا موفق‌شدنش بالا نمی‌آید (`service_completed_successfully`).
# ۴. ★ `init: true` — reaperِ PID 1 برای فرایندهای یتیم.
#
# ⚠️ **مقادیرِ داخلِ `.env.production` با `.env`ِ توسعه فرق دارند**: میزبانِ دیتابیس
# `postgres` است نه `localhost` (نامِ سرویس در شبکه‌ی compose)، همین‌طور `redis`.
name: hamboom-prod

x-restart: &restart unless-stopped

# ★★ چرخشِ لاگ — M5 گام ۸٫۴.
#
# ⚠️ **درایورِ پیش‌فرضِ `json-file` هیچ سقفی ندارد.** یعنی لاگِ یک سرویسِ پرترافیک تا
# پرشدنِ دیسکِ VM بزرگ می‌شود، و بعد **همه‌چیز** می‌ایستد — نه فقط لاگ‌نویسی. این
# رایج‌ترین راهی است که یک استقرارِ تک‌ماشینه می‌میرد.
#
# ⊕ این با «نگهداشتِ داده»ی M5-D9 قاطی نمی‌شود: آن یکی تصمیمِ سیاستی درباره‌ی داده‌ی
#   **کاربر** است و عددش را مالک می‌دهد؛ این یکی بهداشتِ دیسک است و عددش فنی است.
#   ۱۰MB × ۳ فایل = سقفِ ۳۰MB برای هر سرویس.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# envِ کاملِ `apps/api`.
#
# ⊕ تا فاز ۳، کانتینرِ آشتی‌دهی هم از همین استفاده می‌کرد (چون `loadApiConfig` یک‌تکه بود).
# فاز ۴ آن را باریک کرد و حالا anchorِ خودش را دارد — پایین.
x-api-env: &api-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PORT: 3002
  # ★★ M5 گام ۹٫۲: api پورتِ هاست ندارد و هر درخواستش از nginx می‌آید؛ بدونِ این، سقفِ نرخ
  #    روی IPِ nginx کلید می‌خورد و **همه‌ی کاربران یک سطل** دارند (اندازه‌گیری‌شده).
  #    گاردِ بوتِ production بدونش بالا نمی‌آید.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  JWT_SECRET: ${JWT_SECRET}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  RT_TOKEN_TTL_SECONDS: ${RT_TOKEN_TTL_SECONDS:-60}
  # ★★ پیامک — M5 فازِ ۴٫۵. فقط `api` این‌ها را می‌بیند؛ آشتی‌دهی و migrate نه.
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
  SMS_IR_TEMPLATE_ID: ${SMS_IR_TEMPLATE_ID:-}
  SMS_IR_PARAM_NAME: ${SMS_IR_PARAM_NAME:-CODE}
  SMS_IR_BASE_URL: ${SMS_IR_BASE_URL:-https://api.sms.ir}
  SMS_IR_TIMEOUT_MS: ${SMS_IR_TIMEOUT_MS:-10000}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-120}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_OTP_MAX: ${RATE_LIMIT_OTP_MAX:-5}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
  S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS}
  S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
  ZARINPAL_MODE: ${ZARINPAL_MODE:-sandbox}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL}
  VAT_PERCENT: ${VAT_PERCENT:-0}
  WEB_BASE_URL: ${WEB_BASE_URL}
  # ⚠️ پیش‌فرض خاموش می‌مانَد تا انتخابِ رهبرِ فاز ۶ بیاید (ADR-060).
  BILLING_RECONCILE_ENABLED: ${BILLING_RECONCILE_ENABLED:-false}
  BILLING_RECONCILE_INTERVAL_SECONDS: ${BILLING_RECONCILE_INTERVAL_SECONDS:-300}
  BILLING_PENDING_STALE_MINUTES: ${BILLING_PENDING_STALE_MINUTES:-20}
  BILLING_PENDING_EXPIRE_HOURS: ${BILLING_PENDING_EXPIRE_HOURS:-72}
  BILLING_RECONCILE_BATCH: ${BILLING_RECONCILE_BATCH:-50}
  BILLING_ADOPT_ORPHANS: ${BILLING_ADOPT_ORPHANS:-false}

# ★ envِ **باریکِ** کارِ آشتی‌دهی — M5 گام ۴٫۲.
#
# ⚠️ تا فاز ۳ این کانتینر کلِ `*api-env` را می‌گرفت، چون `billing-reconcile.ts` همان
# `loadApiConfig` را صدا می‌زد. حالا `loadReconcileConfig` باریک است، پس یک ابزارِ
# اپراتور دیگر **`JWT_SECRET` و کلیدهای S3 را نمی‌بیند** — کمترین دسترسیِ لازم.
x-reconcile-env: &reconcile-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
  ZARINPAL_MODE: ${ZARINPAL_MODE:-sandbox}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL}
  BILLING_PENDING_STALE_MINUTES: ${BILLING_PENDING_STALE_MINUTES:-20}
  BILLING_PENDING_EXPIRE_HOURS: ${BILLING_PENDING_EXPIRE_HOURS:-72}
  BILLING_RECONCILE_BATCH: ${BILLING_RECONCILE_BATCH:-50}
  BILLING_ADOPT_ORPHANS: ${BILLING_ADOPT_ORPHANS:-false}

# ★ envِ باریکِ کارهای **پشتیبان** — M5 فاز ۷.
#
# ⚠️ مثلِ آشتی‌دهی، این کانتینر `JWT_SECRET` را **نمی‌بیند**: کارش دیتابیس و Object
# Storage است و بس. ⊕ ولی برخلافِ آشتی‌دهی، کلیدهای S3 را **لازم** دارد — و باکتِ
# پشتیبان عمداً سومی است (M5-D7: یک دامنه‌ی خرابی برای داده و پشتیبانش یعنی هیچ
# پشتیبانی).
x-backup-env: &backup-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
  S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS}
  S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS}
  S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS}
  # ★ سیاستِ سطل (M5-D9، تصمیمِ مالک ۱۴۰۵/۰۶/۱۹): ۳۰ روز. مصرف‌کننده فقط `purge`.
  TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    restart: *restart
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
      # فقط EXTENSIONها؛ schema با سرویسِ `migrate` می‌آید (ADR-005).
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    logging: *logging
    restart: *restart
    init: true
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── migration: کانتینرِ یک‌بارمصرفِ **همان ایمیجِ api** (ADR-062) ────────────
  migrate:
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    command: ["node", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}

  api:
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    logging: *logging
    restart: *restart
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api-env

  realtime:
    image: hamboom/realtime:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/realtime.Dockerfile
    logging: *logging
    restart: *restart
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RT_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      REDIS_URL: ${REDIS_URL}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      RT_TOKEN_TTL_SECONDS: ${RT_TOKEN_TTL_SECONDS:-60}
      RT_MAX_ROOMS_PER_NODE: ${RT_MAX_ROOMS_PER_NODE:-500}
      RT_ROOM_IDLE_TIMEOUT_MS: ${RT_ROOM_IDLE_TIMEOUT_MS:-120000}
      # ⚠️ باید **کوتاه‌تر** از `proxy_read_timeout`ِ nginx (۳۶۰۰s) و از idle timeoutِ
      #    هر لودبالانسرِ جلوتر باشد (ADR-006).
      RT_HEARTBEAT_INTERVAL_MS: ${RT_HEARTBEAT_INTERVAL_MS:-25000}
      RT_SNAPSHOT_EVERY_UPDATES: ${RT_SNAPSHOT_EVERY_UPDATES:-500}
      RT_SNAPSHOT_EVERY_MS: ${RT_SNAPSHOT_EVERY_MS:-60000}
      RT_MAX_DOC_BYTES: ${RT_MAX_DOC_BYTES:-52428800}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS}
      S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS}

  # ── تنها دربِ ورودی: SPA + reverse proxy + **لبه‌ی TLS** (M5 گام ۹٫۲) ──────────
  #
  # ★★ حالت را خودِ کانتینر در بوت انتخاب می‌کند (`infra/nginx/10-hamboom-mode.sh`):
  #    - `fullchain.pem` + `privkey.pem` در `TLS_DIR` هست ⇒ ۴۴۳ https + ۸۰ ریدایرکت/ACME + HSTS
  #    - نیست و `APP_ENV=staging`               ⇒ فقط ۸۰ http، با هشدارِ بلند
  #    - نیست و `APP_ENV=production`            ⇒ **بالا نمی‌آید** (همان الگوی گاردهای api)
  #    منبعِ گواهی (آروان / certbot) تصمیمِ روزِ استقرار است — دستورِ هر دو در infra/README.
  web:
    image: hamboom/web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    logging: *logging
    restart: *restart
    init: true
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
    ports:
      - "${WEB_PORT:-80}:8080"
      - "${WEB_TLS_PORT:-443}:8443"
    volumes:
      # ⚠️ مسیرِ نسبی نسبت به **همین پوشه** (infra/docker) است، نه ریشه‌ی ریپو. هر دو gitignore اند.
      - ${TLS_DIR:-./tls}:/etc/hamboom/tls:ro
      - ${ACME_WEBROOT:-./acme}:/var/www/acme:ro

  # ── کارِ دوره‌ایِ آشتی‌دهی: کانتینرِ یک‌بارمصرفِ همان ایمیجِ api ─────────────
  #
  # ★★ [ADR-062](../../ARCHITECTURE_DECISIONS.md#adr-062): کارِ دوره‌ای **worker نمی‌خواهد**.
  #    از cronِ خودِ VM:
  #      docker compose -f … --env-file .env.production run --rm reconcile
  #    ⚠️ `--profile ops` دارد تا با `up -d` بالا نیاید؛ یک sweepِ ناخواسته در بوت،
  #    همان اتلافی است که `BILLING_RECONCILE_ENABLED=false` جلویش را گرفته.
  reconcile:
    profiles: ["ops"]
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    command: ["node", "scripts/billing-reconcile.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *reconcile-env

  # ── ★★ دوامِ داده (M5 فاز ۷) — سه کانتینرِ یک‌بارمصرفِ همان ایمیجِ api ─────
  #
  #   $C --profile ops run --rm backup -- --prune=14   # شبانه، از cronِ VM
  #   $C --profile ops run --rm backup-storage         # شبانه
  #   $C --profile ops run --rm restore-drill          # ★ هفتگی — **گیتِ واقعی**
  #
  # ⚠️ سومی تزئینی نیست: **یک پشتیبانِ بازیابی‌نشده پشتیبان نیست.** روی یک دیتابیسِ
  #    موقتِ `<db>_restore_drill` بازیابی می‌کند (به دیتابیسِ اصلی دست نمی‌زند) و در
  #    پایان پاکش می‌کند.
  backup:
    profiles: ["ops"]
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    command: ["node", "scripts/backup-db.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backup-env

  backup-storage:
    profiles: ["ops"]
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    command: ["node", "scripts/backup-storage.ts"]
    environment: *backup-env

  restore-drill:
    profiles: ["ops"]
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    command: ["node", "scripts/restore-drill.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backup-env

  # ── نگهداشت و پاک‌سازی (M5 فاز ۸) ─────────────────────────────────────────
  #
  #   $C --profile ops run --rm sweep-orphans                    # فقط گزارش
  #   $C --profile ops run --rm sweep-orphans node scripts/sweep-orphans.ts --delete
  #   $C --profile ops run --rm purge node scripts/purge-deleted.ts --delete
  #
  # ⚠️ **ترتیب مهم است:** اول purge (ردیف‌ها) بعد sweep (بلاب‌ها). برعکسش بی‌اثر است،
  #    چون تا ردیف هست جاروب بلاب را «دارای مرجع» می‌بیند.
  # ⚠️⚠️ و هیچ‌کدام پیش‌فرضِ حذف ندارند: `--delete` صریح لازم است. مرزِ purge از
  #    `TRASH_RETENTION_DAYS` می‌آید (M5-D9 = ۳۰ روز، تصمیمِ مالک)؛ `--days=N` فقط
  #    overrideِ یک اجراست، نه راهِ عوض‌کردنِ سیاست.
  sweep-orphans:
    profiles: ["ops"]
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    command: ["node", "scripts/sweep-orphans.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backup-env

  purge:
    profiles: ["ops"]
    image: hamboom/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: "no"
    init: true
    # مرز از سیاست (TRASH_RETENTION_DAYS) می‌آید؛ بدونِ `--delete` فقط گزارش.
    command: ["node", "scripts/purge-deleted.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *backup-env

volumes:
  pgdata:
  redisdata:
