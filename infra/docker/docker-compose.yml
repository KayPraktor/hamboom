# استکِ توسعه‌ی لوکالِ هم‌بوم — **برشِ حداقلی برای ماژول M2**.
#
# ⚠️ این فایل عمداً ناقص است. طبق تصمیمِ D-1 (تاییدِ مالک ۱۴۰۵/۰۵/۱۲) ماژول M2 فقط
# چیزی را می‌سازد که خودش لازم دارد: Postgres (لاگِ update — ADR-009) و Redis
# (pub/sub بینِ نودها — ADR-006). **M5 این فایل را کامل می‌کند** با minio، minio-init،
# و سرویس‌های api/web/worker. نسخه‌ی کاملِ مرجع در PLAN.md بخش ۳ است.
#
# نام سرویس‌ها، متغیرها و پورت‌ها عمداً **دقیقاً** مثلِ PLAN بخش ۳ اند تا M5 فقط
# اضافه کند، نه اینکه چیزی را عوض کند.
#
# اجرا:
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
#
# هیچ‌کدام از این سرویس‌ها در production استفاده نمی‌شوند — در آروان معادلِ Managed
# آن‌ها می‌آید (P3: همه‌چیز لوکال اجرا می‌شود، بدون هیچ حسابِ ابری).
name: hamboom

services:
  postgres:
    image: postgres:16-alpine # آروان Managed PostgreSQL هم 16 دارد
    container_name: hamboom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamboom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamboom_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-hamboom}
      # ترتیبِ مرتب‌سازیِ فارسیِ درست + timezone صریحِ UTC (ADR-018)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # فقط EXTENSION ها. migrationِ واقعی با `pnpm db:migrate` اجرا می‌شود —
      # چون initdb فقط **یک‌بار** روی دیتابیسِ خالی اجرا می‌شود و برای تغییرِ
      # schema بی‌فایده است (ADR-005: migrationِ SQL خامِ ترتیبی).
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamboom} -d ${POSTGRES_DB:-hamboom}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine # آروان Managed Redis
    container_name: hamboom-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-hamboom_dev_pw}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-hamboom_dev_pw} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Object Storage سازگار با S3 — افزوده‌ی M3 گام ۳٫۰ (probe/storage) ──────
  # PLAN §۳ این را برای M5 گذاشته بود، ولی M3 برای `packages/storage` زودتر لازمش
  # دارد. ⚠️ عمداً **بدونِ healthcheck**: تصویرِ minio ابزارِ سلامتِ داخلِ کانتینر را
  # تضمین نمی‌کند؛ خودِ probe/کلاینت آمادگی را با retry می‌سنجد.
  minio:
    image: minio/minio:latest
    container_name: hamboom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-hamboom_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-hamboom_minio_dev_pw}
      MINIO_REGION: ${S3_REGION:-ir-thr-at1}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # ── minio-init — ساختِ باکت‌های assets/snapshots (M3 گام ۵٫۴) ──────────────
  # P3: «docker compose up کافی باشد». روی ماشینِ تازه باکت‌ها هنوز نیستند و اولین
  # آپلود/بوت می‌شکست. یک‌بار اجرا و خارج (`restart: no`). ⚠️ `$$VAR` تا **shell** بسطش
  # دهد از env کانتینر، نه compose. `--ignore-existing` idempotent است.
  minio-init:
    image: minio/mc:latest
    container_name: hamboom-minio-init
    depends_on:
      - minio
    restart: "no"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-hamboom_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-hamboom_minio_dev_pw}
      S3_BUCKET_ASSETS: ${S3_BUCKET_ASSETS:-hamboom-assets}
      S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS:-hamboom-snapshots}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\"; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/\"$$S3_BUCKET_ASSETS\";
      mc mb --ignore-existing local/\"$$S3_BUCKET_SNAPSHOTS\";
      echo 'buckets ready';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
