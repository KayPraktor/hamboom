# بدنه‌ی سرورِ هم‌بوم — M5 گام ۲٫۳ + ۹٫۲ ([ADR-059](../../ARCHITECTURE_DECISIONS.md#adr-059)).
#
# یک مبدأ برای همه‌چیز: SPA، api، و WebSocket. دلیلش همان دلیلِ پروکسیِ devِ Vite است —
# کوکیِ refreshِ HttpOnly مسیرِ `/auth` دارد و `baseUrl`ِ sdk خالی (هم‌مبدأ) است، پس هر
# چیدمانی که api را روی دامنه‌ی دیگری بگذارد CORS و کوکیِ third-party می‌خواهد.
#
# ★ این فایل **داخلِ** یک بلوکِ `server` include می‌شود — کدام بلوک را
# [`10-hamboom-mode.sh`](10-hamboom-mode.sh) در بوت انتخاب می‌کند: با گواهی
# [`server-tls.conf`](server-tls.conf) (۸۴۴۳ + ریدایرکتِ ۸۰۸۰)، بی‌گواهی
# [`server-http.conf`](server-http.conf) (فقط ۸۰۸۰، فقط staging/لوکال).

# نسخه‌ی nginx در هدرِ پاسخ نیاید.
server_tokens off;

root /usr/share/nginx/html;
index index.html;

# بدنه‌ی درخواست‌های api کوچک است؛ آپلودِ فایل **از این‌جا رد نمی‌شود**
# (presignِ مستقیم به Object Storage — P4).
client_max_body_size 1m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# هدرهای امنیتی (+ HSTS در حالتِ TLS) — در بوت ساخته می‌شود.
include /etc/nginx/hamboom/headers.conf;

# ── سلامتِ خودِ nginx ────────────────────────────────────────────────────────
#
# ★ پروکسی نمی‌شود و به api وابسته نیست: HEALTHCHECKِ کانتینر باید «nginx بالاست» را
#   بسنجد، نه «api بالاست» — وگرنه ری‌استارتِ api کانتینرِ web را هم ناسالم می‌کند.
location = /nginx-healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
}

# ★ ACME HTTP-01 در **هر دو** حالت: روزِ صفر با certbot، nginx در حالتِ http (staging) بالا
#   می‌آید و همین مسیر challenge را جواب می‌دهد؛ بعد از گرفتنِ گواهی، حالتِ TLS. بدونِ این،
#   اولین صدور با webroot ممکن نبود (challenge به SPA می‌رفت) — یافته‌ی بازبینیِ runbook.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
}

# ── WebSocketِ realtime ────────────────────────────────────────────────────
#
# ⚠️ `proxy_read_timeout` باید **بلندتر از `RT_HEARTBEAT_INTERVAL_MS`** (۲۵ ثانیه)
#    باشد، وگرنه پروکسی وسطِ کار اتصالِ سالم را می‌بندد و کلاینت وارد چرخه‌ی
#    reconnect می‌شود. pingِ سرور هر ۲۵s این تایمر را از نو می‌شمارد.
#    ★ گام ۹٫۱ اندازه گرفت: نیمه‌ی سرورِ ADR-006 در دو تیکِ heartbeat مسیرِ مرده را
#    می‌بندد؛ این عدد (۳۶۰۰s) هیچ‌وقت زودتر از آن نمی‌رسد.
location /rt {
    # سقفِ سوکتِ همزمان به‌ازای هر IP (نه هر کاربر — CGNAT، زیرِ `zones.conf`).
    limit_conn hb_conn 200;
    proxy_pass http://hamboom_rt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── مسیرهای api ───────────────────────────────────────────────────────────
#
# ★★ این فایل **تولید می‌شود** از `apps/web/src/api-prefixes.ts` — همان فهرستی که
#    پروکسیِ devِ Vite هم از آن می‌آید. `pnpm infra:check-proxy` (داخلِ `pnpm verify`)
#    ثابت می‌کند با مسیرهای واقعیِ ثبت‌شده‌ی api می‌خوانَد. دستی ویرایشش نکن.
#    ⊕ سقفِ نرخِ سخت‌ترِ `/auth/otp` هم همان‌جا تولید می‌شود (گام ۹٫۲).
include /etc/nginx/api-locations.conf;

# ── باندلِ SPA ─────────────────────────────────────────────────────────────
#
# ★ `/static/` به‌جای پیش‌فرضِ `/assets/`ِ Vite — چون `/assets` پیشوندِ api است
#   (`vite.config.ts` دلیلش را دارد). نامِ فایل hash دارد، پس immutable.
location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/hamboom/headers.conf;
    try_files $uri =404;
}

# فونت‌های خودمیزبانِ Excalidraw (P2) — نامشان hash ندارد، پس کشِ کوتاه‌تر.
location /excalidraw-assets/ {
    expires 7d;
    try_files $uri =404;
}

# ── هر چیزِ دیگری: SPA ─────────────────────────────────────────────────────
#
# ⚠️ `index.html` **هرگز** کش نمی‌شود — وگرنه کاربر بعد از استقرارِ نو یک
#    index.htmlِ کهنه می‌گیرد که به باندلِ hashدارِ حذف‌شده اشاره می‌کند.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/hamboom/headers.conf;
}
