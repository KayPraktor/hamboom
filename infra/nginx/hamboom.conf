# reverse proxyِ production — M5 گام ۲٫۳ ([ADR-059](../../ARCHITECTURE_DECISIONS.md#adr-059)).
#
# یک مبدأ برای همه‌چیز: SPA، api، و WebSocket. دلیلش همان دلیلِ پروکسیِ devِ Vite است —
# کوکیِ refreshِ HttpOnly مسیرِ `/auth` دارد و `baseUrl`ِ sdk خالی (هم‌مبدأ) است، پس هر
# چیدمانی که api را روی دامنه‌ی دیگری بگذارد CORS و کوکیِ third-party می‌خواهد.
#
# ⚠️ TLS این‌جا نیست (فاز ۹): این سرور HTTPِ ساده روی ۸۰۸۰ می‌دهد و لبه‌ی TLS جلوترش
# می‌نشیند. تصمیمِ «گواهی از آروان یا ACME روی VM» عمداً باز مانده تا اندازه‌گیری شود.

upstream hamboom_api {
    server api:3002;
    keepalive 16;
}

upstream hamboom_rt {
    server realtime:3001;
}

# ★ نگاشتِ upgrade — مقدارِ درستِ هدرِ `Connection` برای درخواست‌های WS و غیرِ WS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # نسخه‌ی nginx در هدرِ پاسخ نیاید.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # بدنه‌ی درخواست‌های api کوچک است؛ آپلودِ فایل **از این‌جا رد نمی‌شود**
    # (presignِ مستقیم به Object Storage — P4).
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── WebSocketِ realtime ────────────────────────────────────────────
    #
    # ⚠️ `proxy_read_timeout` باید **بلندتر از `RT_HEARTBEAT_INTERVAL_MS`** (۲۵ ثانیه)
    #    باشد، وگرنه پروکسی وسطِ کار اتصالِ سالم را می‌بندد و کلاینت وارد چرخه‌ی
    #    reconnect می‌شود — ریسکِ ثبت‌شده‌ی PLAN §۱۰ که فاز ۹ اندازه‌اش می‌گیرد.
    location /rt {
        proxy_pass http://hamboom_rt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── مسیرهای api ───────────────────────────────────────────────────
    #
    # ★★ این فایل **تولید می‌شود** از `apps/web/src/api-prefixes.ts` — همان فهرستی که
    #    پروکسیِ devِ Vite هم از آن می‌آید. `pnpm infra:check-proxy` (داخلِ `pnpm verify`)
    #    ثابت می‌کند با مسیرهای واقعیِ ثبت‌شده‌ی api می‌خوانَد. دستی ویرایشش نکن.
    include /etc/nginx/api-locations.conf;

    # ── باندلِ SPA ─────────────────────────────────────────────────────
    #
    # ★ `/static/` به‌جای پیش‌فرضِ `/assets/`ِ Vite — چون `/assets` پیشوندِ api است
    #   (`vite.config.ts` دلیلش را دارد). نامِ فایل hash دارد، پس immutable.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # فونت‌های خودمیزبانِ Excalidraw (P2) — نامشان hash ندارد، پس کشِ کوتاه‌تر.
    location /excalidraw-assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # ── هر چیزِ دیگری: SPA ─────────────────────────────────────────────
    #
    # ⚠️ `index.html` **هرگز** کش نمی‌شود — وگرنه کاربر بعد از استقرارِ نو یک
    #    index.htmlِ کهنه می‌گیرد که به باندلِ hashدارِ حذف‌شده اشاره می‌کند.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
