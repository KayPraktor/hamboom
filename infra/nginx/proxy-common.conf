# هدرهای مشترکِ هر proxy_pass — از بلوک‌های `location`ِ تولیدشده include می‌شود.
#
# ⚠️ `X-Forwarded-Proto` را **لبه‌ی TLS** درست می‌کند (فاز ۹). امروز که TLS جلوتر
# ترمینال می‌شود، `$scheme` همان چیزی است که این پروکسی دیده — نه چیزی که کاربر دیده.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# اتصالِ keep-alive به upstream (برای WebSocket جدا تنظیم می‌شود).
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
