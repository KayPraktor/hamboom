# هدرهای مشترکِ هر proxy_pass — از بلوک‌های `location`ِ تولیدشده include می‌شود.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# ★★ **بازنویسی**، نه افزودن (`$proxy_add_x_forwarded_for`) — M5 گام ۹٫۲.
#    api با `TRUST_PROXY` **اولین** IPِ این هدر را باور می‌کند؛ «افزودن» یعنی اولین IP همان
#    چیزی است که **کلاینت** فرستاده — یک هدرِ جعلی، یک سطلِ نرخِ تازه. این nginx تنها
#    پروکسیِ ماست، پس IPِ واقعی همان `$remote_addr` است.
#    ⊕ اگر روزی CDN/لودبالانسری جلوی این nginx نشست، IPِ واقعی را با `set_real_ip_from` +
#      `real_ip_header` در سطحِ http بازیابی کن؛ آن‌وقت `$remote_addr` خودش IPِ کاربر است و
#      این خط همچنان درست می‌مانَد (ناحیه‌های سقفِ نرخ هم).
proxy_set_header X-Forwarded-For $remote_addr;
# در حالتِ TLS همین nginx لبه است، پس `$scheme` همان چیزی است که کاربر دیده.
proxy_set_header X-Forwarded-Proto $scheme;
# اتصالِ keep-alive به upstream (برای WebSocket جدا تنظیم می‌شود).
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# سقفِ نرخِ عمومیِ لبه — ناحیه در `zones.conf`، دلیلِ عددها همان‌جا.
limit_req zone=hb_api burst=60 nodelay;
