# هدرهای امنیتیِ لبه (M5 گام ۹٫۲) — در بوت به `/etc/nginx/hamboom/headers.conf` کپی می‌شود و
# در حالتِ TLS یک خطِ HSTS به آن اضافه می‌شود ([`10-hamboom-mode.sh`](10-hamboom-mode.sh)).
#
# ⚠️ **در هر `location`ی که خودش `add_header` دارد باید دوباره include شود** — قاعده‌ی
#    وراثتِ nginx: یک `add_header` در سطحِ پایین‌تر، **همه‌ی** `add_header`های سطحِ بالاتر
#    را دور می‌ریزد. به همین دلیل `app.conf` این فایل را هم در سطحِ server و هم در
#    `/static/` و `/` include می‌کند.
#
# ── CSP: هنوز عمداً نیست، ولی دیگر یک **حدس** نیست (M6 ردیفِ ۸٫۵) ────────────────────────
#
# ⚠️⚠️ **جمله‌ی قبلیِ همین فایل این بود: «بومِ Excalidraw استایلِ inline و workerِ blob: دارد».**
#      اندازه‌گیری روی باندلِ **واقعیِ** پشتِ همین nginx (سنجه‌ی `pnpm --filter @hamboom/web
#      test:e2e:csp`، ۱۴۰۵/۰۷/۰۷) نشان داد **هر دو نیمه‌اش غلط است**:
#        • با `style-src 'self'` (بدونِ `'unsafe-inline'`) **صفر** تخلف و بوم سالم —
#          استایل‌ها از راهِ CSSOM نوشته می‌شوند، و CSP فقط صفتِ `style`ِ متنی را می‌بیند.
#        • با `worker-src 'self'` (بدونِ `blob:`) هم **صفر** تخلف — در مسیرهای آزموده‌شده
#          هیچ workerی ساخته نشد.
#      آنچه **واقعاً** لازم است این‌هاست:
#        • `img-src data:` — آیکون‌های خودِ excalidraw و مسیرِ تصویرِ ما (blob → data:URI).
#        • اجازه برای **تنها اسکریپتِ inlineِ `index.html`** (تنظیمِ `EXCALIDRAW_ASSET_PATH`).
#          بدونش موتور خطا می‌دهد و بوم **اصلاً بالا نمی‌آید** — تنها چیزی که بوت را می‌شکند.
#      و دو چیز که **لازم نبودند**: `'unsafe-eval'` (یک تماسِ eval بلاک شد و هیچ‌چیز نشکست) و
#      هر چیزی برای وب‌سوکت: `connect-src 'self'` خودش `ws://`ِ هم‌مبدأ را می‌پذیرد (اثبات شد).
#
# ⛔ **پس چرا هنوز enforce نشده؟** دو چیزِ باز:
#   ۱. اسکریپتِ inline باید به یک فایلِ **جدا** برود تا `script-src 'self'` کافی باشد؛ وگرنه
#      پالیسی به یک `sha256` گره می‌خورد که با هر ویرایشِ آن اسکریپت بی‌صدا باطل می‌شود.
#   ۲. `font-src 'self'` کار می‌کند ولی **۲۳۰ تخلف در هر بازکردنِ بورد** چاپ می‌کند: excalidraw
#      به `src`ِ هر فونت یک fallbackِ `https://esm.sh/...` می‌چسبانَد. ⊕ آن‌ها فقط **اعلام**‌اند
#      و هیچ‌کدام fetch نمی‌شوند (هر ۲۳۰ با `duration=0`/`transferSize=0`) — پس P1/P2 سالم است،
#      ولی کنسولِ پر از خطا هر خطای واقعی را دفن می‌کند.
#
# پالیسیِ نامزد (اندازه‌گیری‌شده، **اجرا نشده**) — رولوآتِ درست با `-Report-Only` شروع می‌شود،
# چون این اعداد از مسیرهای آزموده‌شده آمده‌اند (ورود، داشبورد، بورد، استیکی/متن، پنل) نه از همه‌ی اپ:
#
#   add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; \
#     style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; \
#     connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; \
#     base-uri 'self'; form-action 'self'" always;
#
# ⚠️ و یک اثرِ جانبیِ آگاهانه: `frame-src 'none'` قابلیتِ **embedِ ویدیوی چسبانده‌شده**ی
#    excalidraw را می‌بندد (ردیفِ ۸٫۴). برای P2 مطلوب است، ولی یک تصمیم است نه یک اتفاق.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
