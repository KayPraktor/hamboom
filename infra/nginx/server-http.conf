# حالتِ **بدونِ TLS** — فقط staging و لوکال (M5 گام ۹٫۲).
#
# ⚠️ با `APP_ENV=production` این فایل هرگز انتخاب نمی‌شود: [`10-hamboom-mode.sh`](10-hamboom-mode.sh)
#    بدونِ گواهی در production **exit 1** می‌دهد — همان الگوی گاردهای بوتِ api (فاز ۴):
#    production بدونِ TLS یک پیکربندیِ «ضعیف» نیست، **غلط** است.
server {
    listen 8080;
    server_name _;
    include /etc/nginx/hamboom/app.conf;
}
