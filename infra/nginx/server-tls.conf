# حالتِ **TLS** — وقتی `fullchain.pem` + `privkey.pem` در `/etc/hamboom/tls` هست (M5 گام ۹٫۲).
#
# ★★ این فایل به **منبعِ** گواهی بی‌اعتناست: فقط دو فایل می‌خواهد. «آروان یا ACME روی VM»
#    تصمیمِ روزِ استقرار است و از این شبکه اندازه‌گیری می‌شود (TODOی M5)؛ هر دو راه همین
#    دو فایل را می‌سازند. دستورِ هر دو در `infra/README.md`.
#
# ⚠️ در Compose هر دو پورت به هاست می‌روند: ۸۰۸۰→`WEB_PORT` (۸۰) و ۸۴۴۳→`WEB_TLS_PORT` (۴۴۳).

# ── ۸۰۸۰: فقط ریدایرکت، به‌جز ACME و سلامت ────────────────────────────────────
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ★ ACME HTTP-01: اگر گواهی از certbot روی VM بیاید، challenge از همین‌جا (بدونِ TLS،
    #   پیش از ریدایرکت) جواب می‌گیرد. webroot در Compose به `ACME_WEBROOT` وصل است.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── ۸۴۴۳: خودِ اپ ─────────────────────────────────────────────────────────────
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/hamboom/tls/fullchain.pem;
    ssl_certificate_key /etc/hamboom/tls/privkey.pem;

    # پروفایلِ «intermediate»ِ Mozilla: TLS 1.2 با suiteهای مدرن، TLS 1.3 بدونِ تنظیم.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hb_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ⛔ OCSP stapling عمداً خاموش: یک تماسِ **runtime** به سرورِ یک CAی خارجی (P2)، از
    #    ایران کند یا بسته، و Let's Encrypt خودش OCSP را کنار گذاشته (۲۰۲۵). مرورگرها هم
    #    بدونِ آن TLS را قبول می‌کنند.

    include /etc/nginx/hamboom/app.conf;
}
