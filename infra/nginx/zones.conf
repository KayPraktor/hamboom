# ── سطحِ `http`: upstreamها، نگاشتِ upgrade، و ناحیه‌های سقفِ نرخ (M5 گام ۹٫۲) ──────
#
# این فایل به `/etc/nginx/conf.d/00-zones.conf` می‌رود و **پیش از** فایلِ server بارگذاری
# می‌شود (ترتیبِ الفبایی). هیچ `server`ی این‌جا نیست — آن یکی را
# [`10-hamboom-mode.sh`](10-hamboom-mode.sh) در بوت از روی وجود/نبودِ گواهی انتخاب می‌کند.

# ★★ نامِ upstream در **زمانِ اجرا** resolve می‌شود، نه یک بار در بوت (M5 گام ۱۰ — یافته‌ی
#    بازبینیِ runbook، بعد اندازه‌گیری‌شده): `up -d api` کانتینر را با IPِ تازه می‌سازد و nginx با
#    IPِ کهنه **۵۰۲** می‌داد در حالی که هر پنج سرویس healthy بودند. `resolver` همان DNSِ
#    داخلیِ Docker است (در هر شبکه‌ی compose ثابت ۱۲۷٫۰٫۰٫۱۱)، `resolve` روی server از
#    nginx ۱٫۲۷٫۳ در نسخه‌ی آزاد هست (ایمیج ۱٫۲۷٫۵) و `zone` پیش‌نیازِ آن است.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream hamboom_api {
    zone hamboom_api 64k;
    server api:3002 resolve;
    keepalive 16;
}

upstream hamboom_rt {
    zone hamboom_rt 64k;
    server realtime:3001 resolve;
}

# ★ نگاشتِ upgrade — مقدارِ درستِ هدرِ `Connection` برای درخواست‌های WS و غیرِ WS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── ★★ سقفِ نرخِ **لبه** ─────────────────────────────────────────────────────────
#
# پیش از Node، و **مشترک بین همه‌ی نودها**: سقفِ حافظه‌ایِ api با N نود N برابر می‌شود
# (یافته‌ی فاز ۶)؛ این یکی نه. ولی جای آن را نمی‌گیرد — این «سیل» را می‌گیرد، آن «کاربر» را.
#
# ⚠️⚠️ کلید IP است و در ایران IP یعنی **CGNAT**: یک IPِ عمومی می‌تواند یک اداره‌ی ۵۰ نفره
# یا صدها مشترکِ یک اپراتورِ موبایل باشد. پس این عددها برای سیل تنظیم شده‌اند نه برای
# «کاربرِ پرکار»، و **عمداً سخاوتمندند**. سقفِ per-phone (cooldown) در دامنه‌ی api است.
#
# | ناحیه | نرخ | رگبار | کجا |
# |---|---|---|---|
# | `hb_api`  | ۳۰/s | ۶۰ | هر مسیرِ api (`proxy-common.conf`) — یک اداره‌ی داشبوردباز رد نمی‌شود |
# | `hb_auth` | ۱/s  | ۳۰ | فقط `/auth/otp` — مسیرهایی که **پیامک** می‌فرستند (هزینه + اسپم) |
# | `hb_conn` | —    | ۲۰۰ اتصالِ همزمان | `/rt` — سقفِ سوکت به‌ازای هر IP، نه هر کاربر |
limit_req_zone  $binary_remote_addr zone=hb_api:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=hb_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=hb_conn:10m;

# ۴۲۹ مثلِ خودِ api — پیش‌فرضِ nginx ۵۰۳ است که کلاینت آن را «سرور خراب است» می‌فهمد.
limit_req_status  429;
limit_conn_status 429;
